services:
  titan:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3838:3838"
    environment:
      PORT: "3838"
      # ./local-data/auth.sqlite (below) simulates the gcsfuse-mounted path
      # Cloud Run will use in production.
      DB_PATH: "./local-data/auth.sqlite"
      SEED_TEST_ADMIN: "true"
    volumes:
      # Mimics the future gcsfuse volume mount onto a GCS bucket.
      - ./local-data:/srv/titan/local-data
    command: >
      bash -c "Rscript -e 'source(\"R/db_setup.R\"); create_auth_schema(Sys.getenv(\"DB_PATH\")); seed_test_admin(Sys.getenv(\"DB_PATH\"))' &&
               Rscript -e \"shiny::runApp('.', host='0.0.0.0', port=as.integer(Sys.getenv('PORT', 3838)))\""
